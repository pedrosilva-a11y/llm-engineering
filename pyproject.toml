[project]
name = "llm-engineering"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "numpy>=2.4.6",
    "torch>=2.14.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.coverage.run]
omit = [
    "*/__init__.py",
    "*/tests/*",
    "serving/cost_models/catalog.py",
    "serving/engine/demo.py",
]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "D",    # docstrings / pydocstyle
    "UP",   # pyupgrade
]
extend-select = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"
